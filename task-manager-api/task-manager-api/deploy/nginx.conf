# Optional reverse proxy on the EC2 host (port 80 -> API on 5000).
# Install: sudo apt install nginx && copy to /etc/nginx/sites-available/task-api
# Then:    sudo ln -s /etc/nginx/sites-available/task-api /etc/nginx/sites-enabled/ && sudo nginx -t && sudo systemctl reload nginx
# For HTTPS: sudo apt install certbot python3-certbot-nginx && sudo certbot --nginx -d your-domain.com
server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
